  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#000;color:#f5f5f5;font-family:'Cinzel',serif;letter-spacing:0.6px;height:100vh;overflow:hidden;}
    .swirl-wrapper{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
    .swirl-svg{width:120%;height:120%;position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);animation:swirlMove 6s ease-in-out infinite alternate;}
    .swirl-svg path{filter:drop-shadow(0 0 60px rgba(255,95,162,0.6));}
    @keyframes swirlMove{0%{transform:translate(-50%,-50%) scale(1);filter:blur(40px) brightness(1);}100%{transform:translate(-50%,-52%) scale(1.05);filter:blur(45px) brightness(1.15);}}
    .dashboard-container{display:flex;height:100vh;position:relative;z-index:1;}
    .dashboard-sidebar{width:240px;flex-shrink:0;padding:26px 18px;background:rgba(0,0,0,0.82);backdrop-filter:blur(18px);border-right:1px solid rgba(255,255,255,0.12);display:flex;flex-direction:column;}
    .logo-wrapper{margin-bottom:32px;}
    .sidebar-logo{width:190px;max-width:100%;height:auto;display:block;object-fit:contain;}
    .dashboard-sidebar nav a{display:block;margin-bottom:12px;padding:11px 13px;border-radius:10px;color:#e6e6e6;font-weight:500;font-size:13px;letter-spacing:0.8px;text-decoration:none;transition:0.3s ease;}
    .dashboard-sidebar nav a:hover,.dashboard-sidebar nav a.active{background:linear-gradient(90deg,#ff5fa2,#ff9f43,#a855f7);color:#000;font-weight:600;box-shadow:0 0 20px rgba(255,95,162,0.5),0 0 30px rgba(255,159,67,0.4);}
    .logout-link{color:rgba(255,255,255,0.4)!important;font-size:12px!important;margin-top:auto!important;}
    .logout-link:hover{color:#ff5fa2!important;background:transparent!important;box-shadow:none!important;}
    .glass-card{background:rgba(0,0,0,0.75);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,0.12);border-radius:20px;padding:22px;display:flex;flex-direction:column;transition:0.3s ease;}
    .glass-card:hover{transform:translateY(-4px);box-shadow:0 0 35px rgba(255,95,162,0.5),0 0 50px rgba(255,159,67,0.4),0 0 70px rgba(168,85,247,0.35);}
    h3{font-weight:600;letter-spacing:1px;}

    .dashboard-main{flex:1;padding:18px 26px;display:grid;grid-template-rows:auto 1fr;gap:16px;overflow-y:auto;}
    .dashboard-main h2{font-size:22px;letter-spacing:1px;}
    .dashboard-grid-top{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
    .dashboard-grid-middle{display:grid;grid-template-columns:2fr 1fr;gap:14px;}
    .dashboard-grid-top .glass-card{justify-content:space-between;align-items:center;min-height:190px;text-align:center;}
    .dashboard-grid-top h3{font-size:14px;margin-bottom:6px;}
    .dashboard-grid-top .amount{font-size:36px;font-weight:600;margin:auto 0;}
    .dashboard-grid-top .small-text,.dashboard-grid-top .progress,.dashboard-grid-top .insight-box{margin-top:auto;width:100%;}
    .amount{font-size:36px;font-weight:600;margin:8px 0;}
    .income-color{color:#ca67e3;}.expense-color{color:#f4772e;}
    .small-text{opacity:0.6;font-size:12px;font-family:'Poppins',sans-serif;}
    .progress{height:5px;background:rgba(255,255,255,0.1);border-radius:10px;margin:10px 0 0;width:100%;}
    .progress-fill{height:100%;border-radius:10px;background:linear-gradient(90deg,#ff5fa2,#ff9f43);}
    .insight-box{padding:7px 10px;border-radius:8px;background:rgba(255,95,162,0.1);font-size:11px;font-family:'Poppins',sans-serif;color:rgba(255,255,255,0.65);margin-top:10px;text-align:center;width:100%;}
    .income-header{width:100%;display:flex;justify-content:space-between;align-items:center;}
    .edit-income-btn{background:linear-gradient(90deg,#ff5fa2,#ff9f43);border:none;padding:4px 10px;border-radius:8px;font-size:10px;font-family:'Cinzel',serif;cursor:pointer;color:#000;font-weight:600;}
    .smart-insight-card{justify-content:flex-start!important;align-items:flex-start!important;text-align:left!important;}
    .smart-insight-card h3{width:100%;padding-bottom:10px;margin-bottom:12px;border-bottom:1px solid rgba(255,255,255,0.08);font-size:14px;}
    .smart-insight-card ul{list-style:none;padding:0;width:100%;}
    .insight-list{display:flex;flex-direction:column;gap:0;width:100%;}
    .insight-list li{display:flex;align-items:flex-start;gap:8px;padding:9px 10px;border-radius:8px;font-size:13px;font-family:'Poppins',sans-serif;color:rgba(255,255,255,0.88);line-height:1.55;transition:background 0.2s;}
    .insight-list li:hover{background:rgba(255,255,255,0.04);}
    .insight-list li+li{border-top:1px solid rgba(255,255,255,0.05);}
    .trend-chart-card h3{margin-bottom:2px;font-size:15px;}
    .trend-subtitle{font-family:'Poppins',sans-serif;font-size:11px;color:rgba(255,255,255,0.35);margin-bottom:12px;letter-spacing:0.3px;}
    .category-card{display:flex;flex-direction:column;align-items:center;gap:10px;}
    .category-title{text-align:center;font-size:15px;}

</style>
</head>

<script>
// ═══════════════════════════════════════════════════════
//  auth.js  —  Expense Pattern · Master Auth & Storage
//  7-day session · multi-user · hashed passwords
// ═══════════════════════════════════════════════════════

const EP = (function () {

  const KEYS = {
    USERS   : 'ep_users',
    SESSION : 'ep_session',
    SETUP   : 'ep_setup',       // name + currency per user
    INCOME  : 'ep_income',      // income per user
    WALLET  : 'ep_wallet',      // wallet/budget per user
    EXPENSES: 'ep_expenses',    // expenses per user
  };

  const SESSION_DAYS = 7;

  // ── djb2 hash (keeps passwords out of plain text) ──
  function hash(str) {
    let h = 5381;
    for (let i = 0; i < str.length; i++) h = (h * 33) ^ str.charCodeAt(i);
    return (h >>> 0).toString(36);
  }

  // ── Generic storage helpers ──────────────────────────
  function get(key)        { try { return JSON.parse(localStorage.getItem(key)); } catch { return null; } }
  function set(key, val)   { localStorage.setItem(key, JSON.stringify(val)); }
  function remove(key)     { localStorage.removeItem(key); }

  // ── Per-user key namespacing ─────────────────────────
  function userKey(base, username) { return base + ':' + username.toLowerCase(); }

  // ════════════════════════════════════════════
  //  USER STORE
  // ════════════════════════════════════════════
  function loadUsers()      { return get(KEYS.USERS) || []; }
  function saveUsers(users) { set(KEYS.USERS, users); }

  function findUser(username) {
    return loadUsers().find(u => u.username.toLowerCase() === username.trim().toLowerCase());
  }

  // ════════════════════════════════════════════
  //  SESSION
  // ════════════════════════════════════════════
  function writeSession(username) {
    set(KEYS.SESSION, {
      username,
      expiresAt : Date.now() + SESSION_DAYS * 86400000,
      createdAt : Date.now()
    });
  }

  function getSession() {
    const s = get(KEYS.SESSION);
    if (!s) return null;
    if (Date.now() > s.expiresAt) { remove(KEYS.SESSION); return null; }
    return s;
  }

  function clearSession() { remove(KEYS.SESSION); }

  function requireSession(redirectTo) {
    const s = getSession();
    if (!s) { window.location.href = redirectTo || '01-login.html'; return null; }
    return s;
  }

  function getDaysLeft() {
    const s = getSession();
    if (!s) return 0;
    return Math.ceil((s.expiresAt - Date.now()) / 86400000);
  }

  // ════════════════════════════════════════════
  //  AUTH: SIGNUP
  // ════════════════════════════════════════════
  function signup(fullName, dob, username, password) {
    if (!fullName || !dob || !username || !password)
      return { ok: false, error: 'All fields are required.' };

    if (username.trim().length < 3 || username.includes(' '))
      return { ok: false, error: 'Username must be ≥3 chars and have no spaces.' };

    if (password.length < 6)
      return { ok: false, error: 'Password must be at least 6 characters.' };

    // Age check (13+)
    const cutoff = new Date();
    cutoff.setFullYear(cutoff.getFullYear() - 13);
    if (new Date(dob) > cutoff)
      return { ok: false, error: 'You must be at least 13 years old.' };

    const users = loadUsers();
    if (users.some(u => u.username.toLowerCase() === username.trim().toLowerCase()))
      return { ok: false, error: 'That email / username is already registered.' };

    const newUser = {
      fullName  : fullName.trim(),
      dob,
      username  : username.trim(),
      passHash  : hash(password),
      createdAt : Date.now()
    };
    users.push(newUser);
    saveUsers(users);
    writeSession(username.trim());
    return { ok: true, user: newUser };
  }

  // ════════════════════════════════════════════
  //  AUTH: LOGIN
  // ════════════════════════════════════════════
  function login(username, password) {
    if (!username || !password)
      return { ok: false, error: 'Please enter both username and password.' };

    const user = findUser(username);
    if (!user)
      return { ok: false, error: 'No account found with that username.' };

    if (user.passHash !== hash(password))
      return { ok: false, error: 'Incorrect password. Please try again.' };

    writeSession(user.username);
    return { ok: true, user };
  }

  // ════════════════════════════════════════════
  //  AUTH: LOGOUT
  // ════════════════════════════════════════════
  function logout() { clearSession(); window.location.href = '01-login.html'; }

  // ════════════════════════════════════════════
  //  CURRENT USER HELPERS
  // ════════════════════════════════════════════
  function currentUser() {
    const s = getSession();
    if (!s) return null;
    return findUser(s.username);
  }

  function currentUsername() {
    const s = getSession();
    return s ? s.username.toLowerCase() : null;
  }

  // ════════════════════════════════════════════
  //  PER-USER DATA: SETUP (name + currency)
  // ════════════════════════════════════════════
  function saveSetup(name, currency) {
    const u = currentUsername(); if (!u) return;
    set(userKey(KEYS.SETUP, u), { name, currency, savedAt: Date.now() });
  }

  function getSetup() {
    const u = currentUsername(); if (!u) return null;
    return get(userKey(KEYS.SETUP, u));
  }

  // ════════════════════════════════════════════
  //  PER-USER DATA: INCOME
  // ════════════════════════════════════════════
  function saveIncome(amount) {
    const u = currentUsername(); if (!u) return;
    set(userKey(KEYS.INCOME, u), { amount: parseFloat(amount), savedAt: Date.now() });
  }

  function getIncome() {
    const u = currentUsername(); if (!u) return null;
    return get(userKey(KEYS.INCOME, u));
  }

  // ════════════════════════════════════════════
  //  PER-USER DATA: WALLET
  // ════════════════════════════════════════════
  function saveWallet(budgetAmount, budgetPeriod) {
    const u = currentUsername(); if (!u) return;
    const existing = getWallet();

    // Wallet balance should start from the user's income, NOT the budget limit.
    // Budget is just a spending cap for tracking — the actual spendable balance
    // comes from the income the user entered in income.html.
    const incomeData  = getIncome();
    const incomeVal   = incomeData ? incomeData.amount : parseFloat(budgetAmount);
    const totalSpent  = (function() {
      const uk2 = userKey(KEYS.EXPENSES, u);
      try {
        const exps = JSON.parse(localStorage.getItem(uk2)) || [];
        return exps.reduce(function(s, e) { return s + parseFloat(e.amount || 0); }, 0);
      } catch { return 0; }
    })();

    set(userKey(KEYS.WALLET, u), {
      budgetAmount : parseFloat(budgetAmount),
      budgetPeriod,
      // On first save: walletBalance = income minus anything already spent.
      // On re-save (editing): preserve current balance so expenses aren't wiped.
      walletBalance: existing ? existing.walletBalance : (incomeVal - totalSpent),
      createdAt    : existing ? existing.createdAt : new Date().toISOString(),
      updatedAt    : Date.now()
    });
  }

  function getWallet() {
    const u = currentUsername(); if (!u) return null;
    return get(userKey(KEYS.WALLET, u));
  }

  function updateWalletBalance(newBalance) {
    const u = currentUsername(); if (!u) return;
    const w = getWallet(); if (!w) return;
    w.walletBalance = newBalance;
    w.updatedAt = Date.now();
    set(userKey(KEYS.WALLET, u), w);
  }

  // ════════════════════════════════════════════
  //  PER-USER DATA: EXPENSES
  // ════════════════════════════════════════════
  function getExpenses() {
    const u = currentUsername(); if (!u) return [];
    return get(userKey(KEYS.EXPENSES, u)) || [];
  }

  function saveExpenses(expenses) {
    const u = currentUsername(); if (!u) return;
    set(userKey(KEYS.EXPENSES, u), expenses);
  }

  function addExpense(expense) {
    const expenses = getExpenses();
    expense.id = Date.now();
    if (!expense.date) { var _d=new Date(); expense.date=_d.getFullYear()+'-'+String(_d.getMonth()+1).padStart(2,'0')+'-'+String(_d.getDate()).padStart(2,'0'); }
    expenses.push(expense);
    saveExpenses(expenses);

    // Deduct from wallet
    const w = getWallet();
    if (w) updateWalletBalance(w.walletBalance - parseFloat(expense.amount));
    return expense;
  }

  function deleteExpense(id) {
    const expenses = getExpenses();
    const idx = expenses.findIndex(e => e.id === id);
    if (idx === -1) return;
    const removed = expenses[idx];
    expenses.splice(idx, 1);
    saveExpenses(expenses);
    // Refund wallet
    const w = getWallet();
    if (w) updateWalletBalance(w.walletBalance + parseFloat(removed.amount));
  }

  // ════════════════════════════════════════════
  //  CURRENCY SYMBOL HELPER
  // ════════════════════════════════════════════
  function currencySymbol() {
    const setup = getSetup();
    if (!setup || !setup.currency) return '₹';
    const map = {
      'Indian Rupee (₹)': '₹',
      'US Dollar ($)': '$',
      'Euro (€)': '€',
      'British Pound (£)': '£',
      'Japanese Yen (¥)': '¥',
      'Canadian Dollar (C$)': 'C$',
      'Australian Dollar (A$)': 'A$',
      'Singapore Dollar (S$)': 'S$',
      'UAE Dirham (د.إ)': 'د.إ',
      'Chinese Yuan (¥)': '¥'
    };
    return map[setup.currency] || '₹';
  }

  // ════════════════════════════════════════════
  //  UI HELPERS — shared error/success display
  // ════════════════════════════════════════════
  function showError(elId, msg) {
    const el = document.getElementById(elId);
    if (!el) { alert(msg); return; }
    el.textContent = msg;
    el.style.display = 'block';
    el.style.color = '#ff5fa2';
    el.style.fontSize = '0.8rem';
    el.style.textAlign = 'center';
    el.style.marginBottom = '10px';
    el.style.padding = '8px';
    el.style.borderRadius = '8px';
    el.style.background = 'rgba(255,95,162,0.08)';
  }

  function hideError(elId) {
    const el = document.getElementById(elId);
    if (el) el.style.display = 'none';
  }

  // ════════════════════════════════════════════
  //  PUBLIC API
  // ════════════════════════════════════════════
  return {
    signup, login, logout,
    getSession, requireSession, getDaysLeft, currentUser, currentUsername,
    saveSetup, getSetup,
    saveIncome, getIncome,
    saveWallet, getWallet, updateWalletBalance,
    getExpenses, saveExpenses, addExpense, deleteExpense,
    currencySymbol,
    showError, hideError
  };

})();

</script>
<script>

(function(){
  var session = EP.requireSession('01-login.html');
  if (!session) return;

  var setup   = EP.getSetup();
  var income  = EP.getIncome();
  var wallet  = EP.getWallet();
  var sym     = EP.currencySymbol();
  var expenses = EP.getExpenses();

  // Greeting
  var name = setup ? setup.name : session.username;
  var hour = new Date().getHours();
  var greet = hour < 12 ? 'Good Morning' : hour < 17 ? 'Good Afternoon' : 'Good Evening';
  document.getElementById('welcomeText').textContent = greet + ', ' + name + ' \ud83d\udc4b';

  // Logout
  document.querySelector('.logout-link').addEventListener('click', function(e){ e.preventDefault(); EP.logout(); });

  // Wallet card — compute from totalSpent vs budgetAmount, clamp 0-100, no negatives
  var totalExp = expenses.reduce(function(s, e){ return s + parseFloat(e.amount || 0); }, 0);
  if (wallet) {
    var spent = Math.max(0, totalExp);
    var pct = wallet.budgetAmount > 0 ? Math.min(100, (spent / wallet.budgetAmount) * 100) : 0;
    var remaining = Math.max(0, wallet.budgetAmount - spent);
    document.getElementById('walletAmount').textContent = sym + remaining.toLocaleString();
    document.getElementById('budgetAmount').textContent = sym + wallet.budgetAmount.toLocaleString();
    document.getElementById('budgetProgress').style.width = pct.toFixed(1) + '%';
    document.getElementById('budgetInsight').textContent = 'Budget used: ' + sym + spent.toLocaleString() + ' of ' + sym + wallet.budgetAmount.toLocaleString();
  } else {
    document.getElementById('walletAmount').textContent = sym + '0';
  }

  // Income & Expense
  if (income) document.getElementById('incomeAmount').textContent = sym + ' ' + income.amount.toLocaleString();
  document.getElementById('expenseAmount').textContent = sym + ' ' + totalExp.toLocaleString();

  // Smart Insights — clamp savings rate 0-100, no negatives
  var savings = income ? Math.max(0, income.amount - totalExp) : 0;
  var savingsPct = (income && income.amount > 0) ? Math.min(100, (savings / income.amount) * 100).toFixed(1) : '0.0';
  var catTotals = {};
  expenses.forEach(function(e){ var c = e.category || 'Others'; catTotals[c] = (catTotals[c] || 0) + parseFloat(e.amount || 0); });
  var topCat = Object.entries(catTotals).sort(function(a,b){ return b[1]-a[1]; })[0];
  var highValThreshold = income ? income.amount * 0.1 : 5000;
  var highVal = expenses.filter(function(e){ return parseFloat(e.amount) > highValThreshold; }).length;
  var budgetPct = wallet && wallet.budgetAmount > 0 ? Math.min(100, (totalExp / wallet.budgetAmount) * 100).toFixed(0) : '0';
  var insights = [];
  if (income) insights.push('\ud83d\udcb0 Savings rate: ' + savingsPct + '% this month.');
  if (topCat) insights.push('\ud83d\udcca Highest: ' + topCat[0] + ' (' + sym + topCat[1].toLocaleString() + ')');
  if (highVal) insights.push('\u26a0 ' + highVal + ' high-value expense' + (highVal > 1 ? 's' : '') + ' detected.');
  if (wallet) insights.push('\ud83d\udcb3 ' + budgetPct + '% of budget used.');
  if (!insights.length) insights.push('Add expenses to see insights!');
  document.getElementById('insightList').innerHTML = insights.map(function(i){ return '<li>' + i + '</li>'; }).join('');

  // Trend chart — dynamic rolling timeline from expense dates
  // Window spans from earliest to latest expense date (min 7 days), always includes today.
  // Month transitions are handled naturally by Date arithmetic.
  (function(){
    var canvas = document.getElementById('trendChart');
    var ctx2d = canvas.getContext('2d');
    var today = new Date(); today.setHours(0,0,0,0);
    var windowStart, windowEnd;
    var expDates = expenses.map(function(e){ return e.date; }).filter(Boolean);
    if (expDates.length === 0) {
      windowEnd = new Date(today);
      windowStart = new Date(today); windowStart.setDate(windowStart.getDate() - 6);
    } else {
      var parsed = expDates.map(function(d){ var p=d.split('-'); return new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2])); });
      var minD = new Date(Math.min.apply(null, parsed));
      var maxD = new Date(Math.max.apply(null, parsed));
      if (today > maxD) maxD = new Date(today);
      if (today < minD) minD = new Date(today);
      var span = Math.round((maxD - minD) / 86400000) + 1;
      if (span < 7) { minD = new Date(maxD); minD.setDate(minD.getDate() - 6); }
      windowStart = minD; windowEnd = maxD;
    }
    function toLocalISO(d) { return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
    var days = [], cur = new Date(windowStart);
    while (cur <= windowEnd) { days.push(toLocalISO(cur)); cur.setDate(cur.getDate() + 1); }
    var labels = days.map(function(iso){ var d = new Date(iso + 'T00:00:00'); return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); });
    var dailyData = days.map(function(day){ return expenses.filter(function(e){ return e.date === day; }).reduce(function(s,e){ return s + parseFloat(e.amount || 0); }, 0); });
    var grad = ctx2d.createLinearGradient(0,0,0,240);
    grad.addColorStop(0,'rgba(255,95,162,0.45)'); grad.addColorStop(0.5,'rgba(255,159,67,0.18)'); grad.addColorStop(1,'rgba(168,85,247,0.03)');
    new Chart(canvas,{type:'line',data:{labels:labels,datasets:[{label:'Daily Spending',data:dailyData,fill:true,backgroundColor:grad,borderColor:'#ff5fa2',borderWidth:2.5,pointBackgroundColor:'#ff9f43',pointBorderColor:'#fff',pointBorderWidth:1.5,pointRadius:5,pointHoverRadius:7,tension:0.42}]},options:{responsive:true,maintainAspectRatio:true,interaction:{mode:'index',intersect:false},plugins:{legend:{labels:{color:'rgba(255,255,255,0.7)',font:{family:'Cinzel,serif',size:11},boxWidth:14,padding:14}},tooltip:{backgroundColor:'rgba(10,10,10,0.92)',borderColor:'rgba(255,95,162,0.4)',borderWidth:1,titleColor:'#ff9f43',bodyColor:'#fff',padding:10,callbacks:{label:function(c){return '  '+sym+c.raw.toLocaleString();}}}},scales:{x:{grid:{color:'rgba(255,255,255,0.05)'},ticks:{color:'rgba(255,255,255,0.55)',font:{size:10},maxTicksLimit:10}},y:{beginAtZero:true,grid:{color:'rgba(255,255,255,0.07)'},ticks:{color:'rgba(255,255,255,0.55)',font:{size:10},callback:function(v){return sym+v.toLocaleString();}}}}}}); 
  })();

  // Category Pie — no hardcoded data, clean empty state
  var CATS=[{l:'\u{1F3E0} Housing',c:'#F6B26B'},{l:'\u{1F37D}\uFE0F Food & Dining',c:'#F77F00'},{l:'\u{1F34E} Groceries',c:'#D65A31'},{l:'\u{1F697} Transport',c:'#FF9ACD'},{l:'\u{1F393} Education',c:'#FF5FA2'},{l:'\u{1F3E5} Medical',c:'#D63384'},{l:'\u{1F6CD}\uFE0F Shopping',c:'#C77DFF'},{l:'\u{1F3AC} Entertainment',c:'#9D4EDD'},{l:'\u{1F4E6} Others',c:'#5A189A'}];
  function buildPieData(exps){ var map={}; exps.forEach(function(e){ var c=e.category||'\u{1F4E6} Others'; map[c]=(map[c]||0)+parseFloat(e.amount||0); }); if(!Object.keys(map).length) return {labels:['No expenses'],data:[1],colors:['rgba(255,255,255,0.08)']}; var labels=Object.keys(map); var data=Object.values(map); var colors=labels.map(function(l,i){ var f=CATS.find(function(c){ return c.l.includes(l.replace(/^[^ ]+ /,''))||l.includes(c.l.replace(/^[^ ]+ /,'')); }); return f?f.c:CATS[i%CATS.length].c; }); return {labels:labels,data:data,colors:colors}; }
  var pieD=buildPieData(expenses);
  new Chart(document.getElementById('categoryPieChart'),{type:'pie',data:{labels:pieD.labels,datasets:[{data:pieD.data,backgroundColor:pieD.colors}]},options:{plugins:{legend:{position:'bottom',labels:{color:'#fff',font:{size:9},padding:6}},tooltip:{callbacks:{label:function(ctx){ var t=ctx.chart.data.datasets[0].data.reduce(function(a,b){return a+b;},0); return (t>1)?(sym+ctx.raw.toLocaleString()+' ('+(t>0?(ctx.raw/t*100).toFixed(1):0)+'%)'):''; }}}}}});

})();

</script>
</body></html>
